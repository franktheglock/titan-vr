pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
}
rootProject.name = 'titan-vr'

// The Paper plugin: the same server code, wired to Paper instead of Fabric (clients still use the Fabric mod).
include 'paper'
