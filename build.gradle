plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		// Scripted smoke test: loads run/saves/TitanTest and plays a giant scenario, saving screenshots.
		autotest {
			client()
			name "Titan Autotest"
			vmArg "-Dtitanvr.autotest=true"
			vmArg "-Dtitanvr.autotest.start=" + (project.findProperty("autotestStart") ?: "0")
			vmArg "-Dtitanvr.autotest.arena=" + (project.findProperty("autotestArena") ?: "false")
			programArgs "--quickPlaySingleplayer", "TitanTest"
		}
		server {
			runDir "run-server"
		}
		// Joins the dev server above (run both) to check multiplayer.
		joinServer {
			client()
			name "Join Dev Server"
			programArgs "--quickPlayMultiplayer", "localhost:25565"
		}
	}
	mods {
		"titanvr" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Vivecraft provides stereo rendering + head/hand tracking. We only compile against its API;
	// it must be installed alongside this mod at runtime (and is put on the dev runtime classpath).
	implementation "maven.modrinth:vivecraft:${project.vivecraft_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
